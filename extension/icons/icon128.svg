<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad128" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ff9500"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Ticket shape -->
  <rect x="8" y="24" width="112" height="80" rx="16" fill="url(#grad128)" filter="url(#shadow)"/>
  
  <!-- Perforated line -->
  <line x1="40" y1="24" x2="40" y2="104" stroke="#1a1a2e" stroke-width="3" stroke-dasharray="8,4"/>
  
  <!-- Left side details -->
  <rect x="16" y="40" width="16" height="6" rx="2" fill="#1a1a2e"/>
  <rect x="16" y="52" width="16" height="6" rx="2" fill="#1a1a2e"/>
  <rect x="16" y="64" width="16" height="6" rx="2" fill="#1a1a2e"/>
  <rect x="16" y="76" width="16" height="6" rx="2" fill="#1a1a2e"/>
  
  <!-- Right side - ticket icon area -->
  <circle cx="88" cy="64" r="24" fill="#1a1a2e"/>
  <text x="88" y="72" font-family="Arial" font-size="32" fill="#ffd700" text-anchor="middle">🎟️</text>
  
  <!-- Beitar text -->
  <text x="88" y="96" font-family="Arial" font-size="10" fill="#1a1a2e" text-anchor="middle" font-weight="bold">BEITAR</text>
</svg>